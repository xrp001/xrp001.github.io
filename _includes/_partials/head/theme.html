<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f5" id="theme-color">
<script>
  (function () {
    var root = document.documentElement;
    var system = window.matchMedia('(prefers-color-scheme: dark)');
    var choice = 'system';
    try { choice = localStorage.getItem('next-color-mode') || 'system'; } catch (e) {}
    function valid(value) { return ['light', 'dark', 'system'].indexOf(value) !== -1; }
    if (!valid(choice)) choice = 'system';
    function apply() {
      var dark = choice === 'dark' || (choice === 'system' && system.matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.style.colorScheme = dark ? 'dark' : 'light';
      document.getElementById('theme-color').content = dark ? '#20252b' : '#f5f5f5';
      document.querySelectorAll('[data-color-mode]').forEach(function (item) {
        item.setAttribute('aria-checked', String(item.getAttribute('data-color-mode') === choice));
      });
    }
    apply();
    if (system.addEventListener) system.addEventListener('change', apply);
    else system.addListener(apply);
    window.addEventListener('storage', function (event) {
      if (event.key === 'next-color-mode' || event.key === null) {
        choice = valid(event.newValue) ? event.newValue : 'system';
        apply();
      }
    });
    document.addEventListener('DOMContentLoaded', function () {
      var panel = document.getElementById('theme-menu');
      if (!panel) return;
      var triggers = document.querySelectorAll('.theme-trigger');
      var items = Array.prototype.slice.call(panel.querySelectorAll('[data-color-mode]'));
      var activeTrigger;
      apply();
      document.querySelectorAll('.theme-controls').forEach(function (control) { control.hidden = false; });
      function close(restoreFocus) {
        panel.hidden = true;
        triggers.forEach(function (button) { button.setAttribute('aria-expanded', 'false'); });
        if (restoreFocus && activeTrigger) activeTrigger.focus();
      }
      function open(button) {
        if (!panel.hidden && activeTrigger === button) { close(true); return; }
        close(false);
        activeTrigger = button;
        panel.hidden = false;
        button.setAttribute('aria-expanded', 'true');
        var rect = button.getBoundingClientRect();
        var left = Math.max(8, Math.min(rect.right - panel.offsetWidth, window.innerWidth - panel.offsetWidth - 8));
        panel.style.left = left + 'px';
        panel.style.top = rect.bottom + 8 + 'px';
        panel.querySelector('[aria-checked="true"]').focus();
      }
      triggers.forEach(function (button) {
        button.addEventListener('click', function () { open(button); });
        button.addEventListener('keydown', function (event) {
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            open(button);
          }
        });
      });
      items.forEach(function (item) {
        item.addEventListener('click', function () {
          choice = item.getAttribute('data-color-mode');
          try { localStorage.setItem('next-color-mode', choice); } catch (e) {}
          apply();
          close(true);
        });
      });
      panel.addEventListener('keydown', function (event) {
        var index = items.indexOf(document.activeElement);
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          items[(index + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
        } else if (event.key === 'Home' || event.key === 'End') {
          event.preventDefault();
          items[event.key === 'Home' ? 0 : items.length - 1].focus();
        } else if (event.key === 'Tab') {
          close(true);
        }
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && !panel.hidden) {
          event.preventDefault();
          close(true);
        }
      });
      document.addEventListener('click', function (event) {
        if (!panel.contains(event.target) && !event.target.closest('.theme-trigger')) close(false);
      }, true);
      document.addEventListener('focusin', function (event) {
        if (!panel.contains(event.target) && !event.target.closest('.theme-trigger')) close(false);
      });
      window.addEventListener('resize', function () { close(false); });
      window.addEventListener('scroll', function () { close(false); }, {passive: true});
    });
  })();
</script>
