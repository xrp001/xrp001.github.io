<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f5" id="theme-color">
<script>
  (function () {
    var root = document.documentElement;
    var system = window.matchMedia('(prefers-color-scheme: dark)');
    var choice = 'system';
    try { choice = localStorage.getItem('next-color-mode') || 'system'; } catch (e) {}
    function valid(value) { return ['light', 'dark', 'system'].indexOf(value) !== -1; }
    if (!valid(choice)) choice = 'system';
    function apply() {
      var dark = choice === 'dark' || (choice === 'system' && system.matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.style.colorScheme = dark ? 'dark' : 'light';
      document.getElementById('theme-color').content = dark ? '#20252b' : '#f5f5f5';
      var select = document.getElementById('theme-select');
      if (select) select.value = choice;
    }
    apply();
    if (system.addEventListener) system.addEventListener('change', apply);
    else system.addListener(apply);
    window.addEventListener('storage', function (event) {
      if (event.key === 'next-color-mode' || event.key === null) {
        choice = valid(event.newValue) ? event.newValue : 'system';
        apply();
      }
    });
    document.addEventListener('DOMContentLoaded', function () {
      var select = document.getElementById('theme-select');
      if (!select) return;
      apply();
      select.parentNode.hidden = false;
      select.addEventListener('change', function () {
        choice = valid(select.value) ? select.value : 'system';
        try { localStorage.setItem('next-color-mode', choice); } catch (e) {}
        apply();
      });
    });
  })();
</script>
